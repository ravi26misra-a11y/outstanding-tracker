<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outstanding Recovery Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- SheetJS Library -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body { background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .card-party { border-left: 4px solid #0d6efd; border-radius: 10px; background: #fff; margin-bottom: 12px; }
    .amt-badge { font-size: 1.15rem; font-weight: 700; color: #dc3545; }
    .btn-circle { width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
  </style>
</head>
<body class="p-2 p-md-3">

<div class="container-fluid" style="max-width: 750px;">

  <!-- Header -->
  <div class="card shadow-sm mb-3">
    <div class="card-body p-3">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h5 class="fw-bold mb-0 text-primary"><i class="fa-solid fa-file-invoice-dollar me-2"></i>Recovery Dashboard</h5>
          <small class="text-muted" id="fileStatus">No file loaded</small>
        </div>
        <div>
          <label class="btn btn-sm btn-primary fw-bold mb-0">
            <i class="fa-solid fa-file-arrow-up me-1"></i> Upload XLS
            <input type="file" id="fileInput" accept=".xls,.xlsx" style="display: none;" onchange="handleFileUpload(event)">
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- Filter & Operator Switcher -->
  <div class="card shadow-sm mb-3">
    <div class="card-body p-3">
      <div class="row g-2">
        <div class="col-12 col-sm-6">
          <label class="form-label small fw-bold mb-1">Select Operator</label>
          <select id="operatorSelect" class="form-select form-select-sm" onchange="renderParties()">
            <option value="">-- Sabhi Parties (Admin) --</option>
          </select>
        </div>
        <div class="col-12 col-sm-6">
          <label class="form-label small fw-bold mb-1">Search Party / Code</label>
          <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Search by name or code..." onkeyup="renderParties()">
        </div>
      </div>

      <!-- Quick Summary -->
      <div class="row g-2 mt-2 pt-2 border-top text-center">
        <div class="col-6">
          <small class="text-muted d-block">Total Parties</small>
          <span class="fw-bold fs-6" id="totalCount">0</span>
        </div>
        <div class="col-6">
          <small class="text-muted d-block">Total Outstanding</small>
          <span class="fw-bold fs-6 text-danger" id="totalAmt">₹0</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Loading State -->
  <div id="loader" class="text-center py-4 d-none">
    <div class="spinner-border text-primary" role="status"></div>
    <div class="small text-muted mt-2">Processing Excel Data...</div>
  </div>

  <!-- Parties List Container -->
  <div id="partiesContainer"></div>

</div>

<!-- Modal: Party Bills Breakdown -->
<div class="modal fade" id="billModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header py-2 bg-light">
        <h6 class="modal-title fw-bold" id="billModalTitle">Party Invoices</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-2" id="billModalBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let consolidatedParties = [];
  let billModal = null;

  window.onload = function() {
    billModal = new bootstrap.Modal(document.getElementById('billModal'));
    const saved = localStorage.getItem('outstanding_parties_v3');
    if (saved) {
      consolidatedParties = JSON.parse(saved);
      document.getElementById('fileStatus').innerText = 'Loaded from cache';
      populateOperators();
      renderParties();
    }
  };

  // Convert any format (M/D/YY, Excel serial, ISO) strictly to DD/MM/YYYY
  function convertToDateString(val) {
    if (!val && val !== 0) return '-';

    // 1. Agar Date object hai
    if (val instanceof Date) {
      const d = val.getDate();
      const m = val.getMonth() + 1;
      const y = val.getFullYear();
      return `${d}/${m}/${y}`;
    }

    const str = String(val).replace(/\x00/g, '').trim();

    // 2. Agar "4/28/26" ya "04/28/2026" (M/D/YY) format me ho
    if (str.includes('/')) {
      const parts = str.split('/');
      if (parts.length === 3) {
        const m = parseInt(parts[0], 10);
        const d = parseInt(parts[1], 10);
        let y = parseInt(parts[2], 10);
        if (y < 100) y += 2000; // 26 -> 2026
        if (!isNaN(d) && !isNaN(m) && !isNaN(y)) {
          return `${d}/${m}/${y}`;
        }
      }
    }

    // 3. Agar "YYYY-MM-DD" format me ho
    if (str.includes('-')) {
      const parts = str.split('T')[0].split('-');
      if (parts.length === 3 && parts[0].length === 4) {
        const y = parseInt(parts[0], 10);
        const m = parseInt(parts[1], 10);
        const d = parseInt(parts[2], 10);
        return `${d}/${m}/${y}`;
      }
    }

    // 4. Agar Excel serial number ho (e.g. 46140)
    const num = parseFloat(str.replace(/[^0-9.]/g, ''));
    if (!isNaN(num) && num > 30000 && num < 70000) {
      const utcDays = Math.floor(num - 25569);
      const dateObj = new Date(utcDays * 86400 * 1000);
      const d = dateObj.getUTCDate();
      const m = dateObj.getUTCMonth() + 1;
      const y = dateObj.getUTCFullYear();
      return `${d}/${m}/${y}`;
    }

    return str || '-';
  }

  // 1. Direct File Upload Parser
  function handleFileUpload(e) {
    const file = e.target.files[0];
    if (!file) return;

    document.getElementById('loader').classList.remove('d-none');
    document.getElementById('fileStatus').innerText = 'Reading ' + file.name + '...';

    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheetName = workbook.SheetNames[0];
        // raw: false ensures formatting like m/d/yy is captured, which convertToDateString converts to d/m/yyyy
        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheetName], { defval: '', raw: false });

        processRawRows(rows);
        document.getElementById('fileStatus').innerText = file.name + ' (' + rows.length + ' rows)';
      } catch (err) {
        alert('File read error: ' + err.message);
      } finally {
        document.getElementById('loader').classList.add('d-none');
      }
    };
    reader.readAsArrayBuffer(file);
  }

  // 2. Data Cleaning & Party Aggregation
  function processRawRows(rows) {
    const map = {};

    rows.forEach(r => {
      const clean = (val) => String(val || '').replace(/\x00/g, '').trim();

      const code = clean(r.c_code);
      const partyFullName = clean(r.c_group);
      const operator = clean(r.c_cr1);
      const address = clean(r.c_address1);
      const balAmt = parseFloat(String(r.n_bal_amt).replace(/,/g, '')) || 0;
      
      // Clean Bill No (remove trailing .0)
      let invNo = clean(r.n_srno);
      if (invNo.endsWith('.0')) invNo = invNo.slice(0, -2);

      const invDate = convertToDateString(r.d_date);
      const dueDate = convertToDateString(r.d_due_date);

      if (!code || balAmt <= 0) return;

      // Extract 10-digit mobile number
      const phoneMatches = address.match(/\d{10}/g);
      const primaryPhone = phoneMatches ? phoneMatches[0] : '';

      if (!map[code]) {
        map[code] = {
          code: code,
          name: partyFullName,
          operator: operator,
          phone: primaryPhone,
          totalBal: 0,
          bills: []
        };
      }

      map[code].totalBal += balAmt;
      map[code].bills.push({
        invNo: invNo,
        balAmt: balAmt,
        invDate: invDate,
        dueDate: dueDate
      });
    });

    // Array me convert aur highest outstanding se sort
    consolidatedParties = Object.values(map).sort((a, b) => b.totalBal - a.totalBal);

    // Save to LocalStorage (v3 key to force fresh storage)
    localStorage.removeItem('outstanding_parties');
    localStorage.removeItem('outstanding_parties_v2');
    localStorage.setItem('outstanding_parties_v3', JSON.stringify(consolidatedParties));

    populateOperators();
    renderParties();
  }

  // 3. Dropdown list bharo
  function populateOperators() {
    const ops = [...new Set(consolidatedParties.map(p => p.operator).filter(Boolean))].sort();
    const select = document.getElementById('operatorSelect');
    select.innerHTML = '<option value="">-- Sabhi Parties (Admin) --</option>';
    ops.forEach(op => {
      select.innerHTML += `<option value="${op}">FOLLOW UP: ${op}</option>`;
    });
  }

  // 4. Render Party Cards
  function renderParties() {
    const selectedOp = document.getElementById('operatorSelect').value.toLowerCase();
    const query = document.getElementById('searchInput').value.toLowerCase();
    const container = document.getElementById('partiesContainer');
    container.innerHTML = '';

    let filtered = consolidatedParties.filter(p => {
      const matchOp = !selectedOp || p.operator.toLowerCase() === selectedOp;
      const matchSearch = p.name.toLowerCase().includes(query) || p.code.toLowerCase().includes(query);
      return matchOp && matchSearch;
    });

    let totalSum = 0;
    filtered.forEach(p => totalSum += p.totalBal);

    document.getElementById('totalCount').innerText = filtered.length;
    document.getElementById('totalAmt').innerText = '₹' + Math.round(totalSum).toLocaleString('en-IN');

    if (filtered.length === 0) {
      container.innerHTML = '<div class="alert alert-light text-center py-4">Koi party nahi mili.</div>';
      return;
    }

    filtered.forEach((p, idx) => {
      const phoneDigits = p.phone.replace(/\D/g, '').slice(-10);
      const waMsg = encodeURIComponent(`Namaskar Sir, aapke account me total ₹${Math.round(p.totalBal).toLocaleString('en-IN')} outstanding pending hai. Kripya payment update karein.`);
      const waLink = phoneDigits ? `https://wa.me/91${phoneDigits}?text=${waMsg}` : '#';
      const telLink = phoneDigits ? `tel:${phoneDigits}` : '#';

      const card = `
        <div class="card card-party shadow-sm p-3">
          <div class="d-flex justify-content-between align-items-start">
            <div style="max-width: 65%;">
              <span class="badge bg-secondary mb-1">${p.code}</span>
              <span class="badge bg-light text-dark border mb-1">${p.operator}</span>
              <h6 class="fw-bold mb-1 text-dark text-truncate" title="${p.name}">${p.name}</h6>
              <div class="small text-muted">
                <i class="fa-solid fa-phone me-1"></i>${phoneDigits ? phoneDigits : 'No Mobile Available'}
              </div>
            </div>
            <div class="text-end">
              <div class="amt-badge">₹${Math.round(p.totalBal).toLocaleString('en-IN')}</div>
              <button class="btn btn-sm btn-link p-0 text-decoration-none" onclick="showBills(${idx})">
                ${p.bills.length} Bill(s) <i class="fa-solid fa-chevron-right small"></i>
              </button>
            </div>
          </div>

          <hr class="my-2">

          <div class="d-flex justify-content-between align-items-center">
            <div class="d-flex gap-2">
              <a href="${telLink}" class="btn-circle bg-primary-subtle text-primary ${!phoneDigits ? 'disabled' : ''}">
                <i class="fa-solid fa-phone"></i>
              </a>
              <a href="${waLink}" target="_blank" class="btn-circle bg-success text-white ${!phoneDigits ? 'disabled' : ''}">
                <i class="fa-brands fa-whatsapp"></i>
              </a>
            </div>
            <button class="btn btn-sm btn-outline-secondary px-3" onclick="recordFollowUpNote('${p.code}')">
              <i class="fa-regular fa-comment-dots me-1"></i> Note
            </button>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });
  }

  // 5. Bill Details Modal Show Karna
  function showBills(idx) {
    const party = consolidatedParties[idx];
    document.getElementById('billModalTitle').innerText = party.name + ' (' + party.code + ')';
    
    let html = `
      <div class="table-responsive">
        <table class="table table-sm table-bordered table-striped mb-0 text-center">
          <thead class="table-dark">
            <tr>
              <th>Bill No</th>
              <th>Bill Date</th>
              <th>Due Date</th>
              <th class="text-end">Balance</th>
            </tr>
          </thead>
          <tbody>
    `;

    party.bills.forEach(b => {
      html += `
        <tr>
          <td class="fw-bold text-dark">${b.invNo}</td>
          <td>${b.invDate}</td>
          <td>${b.dueDate}</td>
          <td class="text-end fw-bold text-danger">₹${Math.round(b.balAmt).toLocaleString('en-IN')}</td>
        </tr>
      `;
    });

    html += `</tbody></table></div>`;
    document.getElementById('billModalBody').innerHTML = html;
    billModal.show();
  }

  function recordFollowUpNote(code) {
    const note = prompt('Enter follow-up update/promise date:');
    if (note) {
      alert('Note saved for party ' + code);
    }
  }
</script>
</body>
</html>
