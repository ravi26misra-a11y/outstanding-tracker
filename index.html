<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outstanding Recovery Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- SheetJS Library -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body { background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .card-party { border-left: 4px solid #0d6efd; border-radius: 10px; background: #fff; margin-bottom: 12px; }
    .amt-badge { font-size: 1.15rem; font-weight: 700; color: #dc3545; }
    .btn-circle { width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
    .nav-pills .nav-link.active { background-color: #0d6efd; font-weight: bold; }
  </style>
</head>
<body class="p-2 p-md-3">

<div class="container-fluid" style="max-width: 850px;">

  <!-- Header Bar -->
  <div class="card shadow-sm mb-3">
    <div class="card-body p-3">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <h5 class="fw-bold mb-0 text-primary"><i class="fa-solid fa-file-invoice-dollar me-2"></i>Recovery Portal</h5>
          <small class="text-muted" id="fileStatus">No file loaded</small>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-dark fw-bold" onclick="openAdminView()">
            <i class="fa-solid fa-user-shield me-1"></i> Admin View
          </button>
          <label class="btn btn-sm btn-primary fw-bold mb-0">
            <i class="fa-solid fa-file-arrow-up me-1"></i> Upload XLS
            <input type="file" id="fileInput" accept=".xls,.xlsx" style="display: none;" onchange="handleFileUpload(event)">
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- Main View Tabs: Operator Mode vs Admin Mode -->
  <ul class="nav nav-pills nav-fill mb-3 bg-white p-1 rounded shadow-sm" id="viewTabs" role="tablist">
    <li class="nav-item">
      <button class="nav-link active" id="tab-operator" onclick="switchView('operator')">
        <i class="fa-solid fa-list-check me-1"></i> Operator Follow-Up
      </button>
    </li>
    <li class="nav-item">
      <button class="nav-link" id="tab-admin" onclick="openAdminView()">
        <i class="fa-solid fa-chart-pie me-1"></i> Admin Insights
      </button>
    </li>
  </ul>

  <!-- 1. OPERATOR VIEW CONTAINER -->
  <div id="operatorViewSection">
    <!-- Filter & Operator Switcher -->
    <div class="card shadow-sm mb-3">
      <div class="card-body p-3">
        <div class="row g-2">
          <div class="col-12 col-sm-6">
            <label class="form-label small fw-bold mb-1">Select Operator</label>
            <select id="operatorSelect" class="form-select form-select-sm" onchange="renderParties()">
              <option value="">-- Sabhi Parties --</option>
            </select>
          </div>
          <div class="col-12 col-sm-6">
            <label class="form-label small fw-bold mb-1">Search Party / Code</label>
            <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Search by name or code..." onkeyup="renderParties()">
          </div>
        </div>

        <!-- Quick Summary -->
        <div class="row g-2 mt-2 pt-2 border-top text-center">
          <div class="col-6">
            <small class="text-muted d-block">Total Parties</small>
            <span class="fw-bold fs-6" id="totalCount">0</span>
          </div>
          <div class="col-6">
            <small class="text-muted d-block">Total Outstanding</small>
            <span class="fw-bold fs-6 text-danger" id="totalAmt">₹0</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Parties List Container -->
    <div id="partiesContainer"></div>
  </div>

  <!-- 2. ADMIN VIEW CONTAINER -->
  <div id="adminViewSection" class="d-none">
    
    <!-- Overall Stats Cards -->
    <div class="row g-2 mb-3">
      <div class="col-4">
        <div class="card shadow-sm text-center p-2 bg-white">
          <small class="text-muted">Total Balance</small>
          <div class="fw-bold text-danger fs-6" id="admTotalAmt">₹0</div>
        </div>
      </div>
      <div class="col-4">
        <div class="card shadow-sm text-center p-2 bg-white">
          <small class="text-muted">Parties Count</small>
          <div class="fw-bold text-dark fs-6" id="admTotalParties">0</div>
        </div>
      </div>
      <div class="col-4">
        <div class="card shadow-sm text-center p-2 bg-white">
          <small class="text-muted">Active Operators</small>
          <div class="fw-bold text-primary fs-6" id="admTotalOps">0</div>
        </div>
      </div>
    </div>

    <!-- Operator-Wise Comparison Table -->
    <div class="card shadow-sm mb-3">
      <div class="card-header bg-white py-2 d-flex justify-content-between align-items-center">
        <h6 class="fw-bold mb-0 text-dark"><i class="fa-solid fa-users me-2 text-primary"></i>Operator Performance & Allocation</h6>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-sm table-bordered table-striped mb-0 align-middle">
            <thead class="table-dark">
              <tr>
                <th>Operator</th>
                <th class="text-center">Parties</th>
                <th class="text-center">Bills</th>
                <th class="text-end">Pending Amount</th>
                <th class="text-center">Action</th>
              </tr>
            </thead>
            <tbody id="adminOperatorTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Top 10 Defaulters / Highest Outstanding -->
    <div class="card shadow-sm mb-3">
      <div class="card-header bg-white py-2">
        <h6 class="fw-bold mb-0 text-danger"><i class="fa-solid fa-triangle-exclamation me-2"></i>Top 10 Highest Outstanding Parties</h6>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-sm table-hover mb-0 align-middle">
            <thead class="table-light">
              <tr>
                <th>#</th>
                <th>Party Name</th>
                <th>Operator</th>
                <th class="text-end">Amount</th>
              </tr>
            </thead>
            <tbody id="adminTopPartiesBody"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <!-- Loading State -->
  <div id="loader" class="text-center py-4 d-none">
    <div class="spinner-border text-primary" role="status"></div>
    <div class="small text-muted mt-2">Processing Data...</div>
  </div>

</div>

<!-- Modal: Party Bills Breakdown -->
<div class="modal fade" id="billModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header py-2 bg-light">
        <h6 class="modal-title fw-bold" id="billModalTitle">Party Invoices</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-2" id="billModalBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let consolidatedParties = [];
  let billModal = null;
  let isAdminAuthenticated = false;

  window.onload = function() {
    billModal = new bootstrap.Modal(document.getElementById('billModal'));
    const saved = localStorage.getItem('outstanding_parties_v3');
    if (saved) {
      consolidatedParties = JSON.parse(saved);
      document.getElementById('fileStatus').innerText = 'Loaded from cache';
      populateOperators();
      renderParties();
    }
  };

  // Convert Date into DD/M/YYYY
  function convertToDateString(val) {
    if (!val && val !== 0) return '-';
    if (val instanceof Date) {
      return `${val.getDate()}/${val.getMonth() + 1}/${val.getFullYear()}`;
    }
    const str = String(val).replace(/\x00/g, '').trim();
    if (str.includes('/')) {
      const parts = str.split('/');
      if (parts.length === 3) {
        const m = parseInt(parts[0], 10);
        const d = parseInt(parts[1], 10);
        let y = parseInt(parts[2], 10);
        if (y < 100) y += 2000;
        if (!isNaN(d) && !isNaN(m) && !isNaN(y)) return `${d}/${m}/${y}`;
      }
    }
    if (str.includes('-')) {
      const parts = str.split('T')[0].split('-');
      if (parts.length === 3 && parts[0].length === 4) {
        return `${parseInt(parts[2], 10)}/${parseInt(parts[1], 10)}/${parseInt(parts[0], 10)}`;
      }
    }
    const num = parseFloat(str.replace(/[^0-9.]/g, ''));
    if (!isNaN(num) && num > 30000 && num < 70000) {
      const dateObj = new Date(Math.floor(num - 25569) * 86400 * 1000);
      return `${dateObj.getUTCDate()}/${dateObj.getUTCMonth() + 1}/${dateObj.getUTCFullYear()}`;
    }
    return str || '-';
  }

  // File Upload Parser
  function handleFileUpload(e) {
    const file = e.target.files[0];
    if (!file) return;

    document.getElementById('loader').classList.remove('d-none');
    document.getElementById('fileStatus').innerText = 'Reading ' + file.name + '...';

    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheetName = workbook.SheetNames[0];
        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheetName], { defval: '', raw: false });

        processRawRows(rows);
        document.getElementById('fileStatus').innerText = file.name + ' (' + rows.length + ' rows)';
      } catch (err) {
        alert('File read error: ' + err.message);
      } finally {
        document.getElementById('loader').classList.add('d-none');
      }
    };
    reader.readAsArrayBuffer(file);
  }

  // Data Processing
  function processRawRows(rows) {
    const map = {};

    rows.forEach(r => {
      const clean = (val) => String(val || '').replace(/\x00/g, '').trim();

      const code = clean(r.c_code);
      const partyFullName = clean(r.c_group);
      const operator = clean(r.c_cr1);
      const address = clean(r.c_address1);
      const balAmt = parseFloat(String(r.n_bal_amt).replace(/,/g, '')) || 0;
      
      let invNo = clean(r.n_srno);
      if (invNo.endsWith('.0')) invNo = invNo.slice(0, -2);

      const invDate = convertToDateString(r.d_date);
      const dueDate = convertToDateString(r.d_due_date);

      if (!code || balAmt <= 0) return;

      const phoneMatches = address.match(/\d{10}/g);
      const primaryPhone = phoneMatches ? phoneMatches[0] : '';

      if (!map[code]) {
        map[code] = {
          code: code,
          name: partyFullName,
          operator: operator || 'UNASSIGNED',
          phone: primaryPhone,
          totalBal: 0,
          bills: []
        };
      }

      map[code].totalBal += balAmt;
      map[code].bills.push({
        invNo: invNo,
        balAmt: balAmt,
        invDate: invDate,
        dueDate: dueDate
      });
    });

    consolidatedParties = Object.values(map).sort((a, b) => b.totalBal - a.totalBal);
    localStorage.setItem('outstanding_parties_v3', JSON.stringify(consolidatedParties));

    populateOperators();
    renderParties();
    if (isAdminAuthenticated) renderAdminDashboard();
  }

  // Dropdown Operator List
  function populateOperators() {
    const ops = [...new Set(consolidatedParties.map(p => p.operator).filter(Boolean))].sort();
    const select = document.getElementById('operatorSelect');
    select.innerHTML = '<option value="">-- Sabhi Parties --</option>';
    ops.forEach(op => {
      select.innerHTML += `<option value="${op}">FOLLOW UP: ${op}</option>`;
    });
  }

  // View Switcher (Tab toggle)
  function switchView(mode) {
    if (mode === 'operator') {
      document.getElementById('operatorViewSection').classList.remove('d-none');
      document.getElementById('adminViewSection').classList.add('d-none');
      document.getElementById('tab-operator').classList.add('active');
      document.getElementById('tab-admin').classList.remove('active');
    } else {
      document.getElementById('operatorViewSection').classList.add('d-none');
      document.getElementById('adminViewSection').classList.remove('d-none');
      document.getElementById('tab-operator').classList.remove('active');
      document.getElementById('tab-admin').classList.add('active');
      renderAdminDashboard();
    }
  }

  // Admin PIN Protection (Default PIN: 1234)
  function openAdminView() {
    if (!isAdminAuthenticated) {
      const pin = prompt('Admin Access PIN dalein:');
      if (pin === '1234') {
        isAdminAuthenticated = true;
        switchView('admin');
      } else {
        alert('Galat PIN! Sirf owner access kar sakte hain.');
      }
    } else {
      switchView('admin');
    }
  }

  // Render Admin Insights Dashboard
  function renderAdminDashboard() {
    if (consolidatedParties.length === 0) return;

    let overallSum = 0;
    let totalBills = 0;
    const opStats = {};

    consolidatedParties.forEach(p => {
      overallSum += p.totalBal;
      totalBills += p.bills.length;
      const op = p.operator;

      if (!opStats[op]) {
        opStats[op] = { name: op, count: 0, bills: 0, amount: 0 };
      }
      opStats[op].count += 1;
      opStats[op].bills += p.bills.length;
      opStats[op].amount += p.totalBal;
    });

    const opList = Object.values(opStats).sort((a, b) => b.amount - a.amount);

    document.getElementById('admTotalAmt').innerText = '₹' + Math.round(overallSum).toLocaleString('en-IN');
    document.getElementById('admTotalParties').innerText = consolidatedParties.length;
    document.getElementById('admTotalOps').innerText = opList.length;

    // Operator comparison table
    const tbody = document.getElementById('adminOperatorTableBody');
    tbody.innerHTML = '';
    opList.forEach(op => {
      tbody.innerHTML += `
        <tr>
          <td class="fw-bold">${op.name}</td>
          <td class="text-center">${op.count}</td>
          <td class="text-center">${op.bills}</td>
          <td class="text-end fw-bold text-danger">₹${Math.round(op.amount).toLocaleString('en-IN')}</td>
          <td class="text-center">
            <button class="btn btn-xs btn-outline-primary py-0 px-2" onclick="filterByAdminOp('${op.name}')">View List</button>
          </td>
        </tr>
      `;
    });

    // Top 10 Defaulters
    const topTbody = document.getElementById('adminTopPartiesBody');
    topTbody.innerHTML = '';
    consolidatedParties.slice(0, 10).forEach((p, i) => {
      topTbody.innerHTML += `
        <tr>
          <td><span class="badge bg-secondary">${i + 1}</span></td>
          <td class="text-truncate" style="max-width: 250px;">
            <div class="fw-bold text-dark">${p.name}</div>
            <small class="text-muted">${p.code}</small>
          </td>
          <td><span class="badge bg-light text-dark border">${p.operator}</span></td>
          <td class="text-end fw-bold text-danger">₹${Math.round(p.totalBal).toLocaleString('en-IN')}</td>
        </tr>
      `;
    });
  }

  // Admin click to jump to operator list
  function filterByAdminOp(opName) {
    switchView('operator');
    document.getElementById('operatorSelect').value = opName;
    renderParties();
  }

  // Render Party Cards for Operator
  function renderParties() {
    const selectedOp = document.getElementById('operatorSelect').value.toLowerCase();
    const query = document.getElementById('searchInput').value.toLowerCase();
    const container = document.getElementById('partiesContainer');
    container.innerHTML = '';

    let filtered = consolidatedParties.filter(p => {
      const matchOp = !selectedOp || p.operator.toLowerCase() === selectedOp;
      const matchSearch = p.name.toLowerCase().includes(query) || p.code.toLowerCase().includes(query);
      return matchOp && matchSearch;
    });

    let totalSum = 0;
    filtered.forEach(p => totalSum += p.totalBal);

    document.getElementById('totalCount').innerText = filtered.length;
    document.getElementById('totalAmt').innerText = '₹' + Math.round(totalSum).toLocaleString('en-IN');

    if (filtered.length === 0) {
      container.innerHTML = '<div class="alert alert-light text-center py-4">Koi party nahi mili.</div>';
      return;
    }

    filtered.forEach((p, idx) => {
      const phoneDigits = p.phone.replace(/\D/g, '').slice(-10);
      const waMsg = encodeURIComponent(`Namaskar Sir, aapke account me total ₹${Math.round(p.totalBal).toLocaleString('en-IN')} outstanding pending hai. Kripya payment update karein.`);
      const waLink = phoneDigits ? `https://wa.me/91${phoneDigits}?text=${waMsg}` : '#';
      const telLink = phoneDigits ? `tel:${phoneDigits}` : '#';

      const card = `
        <div class="card card-party shadow-sm p-3">
          <div class="d-flex justify-content-between align-items-start">
            <div style="max-width: 65%;">
              <span class="badge bg-secondary mb-1">${p.code}</span>
              <span class="badge bg-light text-dark border mb-1">${p.operator}</span>
              <h6 class="fw-bold mb-1 text-dark text-truncate" title="${p.name}">${p.name}</h6>
              <div class="small text-muted">
                <i class="fa-solid fa-phone me-1"></i>${phoneDigits ? phoneDigits : 'No Mobile Available'}
              </div>
            </div>
            <div class="text-end">
              <div class="amt-badge">₹${Math.round(p.totalBal).toLocaleString('en-IN')}</div>
              <button class="btn btn-sm btn-link p-0 text-decoration-none" onclick="showBills(${idx})">
                ${p.bills.length} Bill(s) <i class="fa-solid fa-chevron-right small"></i>
              </button>
            </div>
          </div>

          <hr class="my-2">

          <div class="d-flex justify-content-between align-items-center">
            <div class="d-flex gap-2">
              <a href="${telLink}" class="btn-circle bg-primary-subtle text-primary ${!phoneDigits ? 'disabled' : ''}">
                <i class="fa-solid fa-phone"></i>
              </a>
              <a href="${waLink}" target="_blank" class="btn-circle bg-success text-white ${!phoneDigits ? 'disabled' : ''}">
                <i class="fa-brands fa-whatsapp"></i>
              </a>
            </div>
            <button class="btn btn-sm btn-outline-secondary px-3" onclick="recordFollowUpNote('${p.code}')">
              <i class="fa-regular fa-comment-dots me-1"></i> Note
            </button>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });
  }

  // Show Invoices Breakdown
  function showBills(idx) {
    const party = consolidatedParties[idx];
    document.getElementById('billModalTitle').innerText = party.name + ' (' + party.code + ')';
    
    let html = `
      <div class="table-responsive">
        <table class="table table-sm table-bordered table-striped mb-0 text-center">
          <thead class="table-dark">
            <tr>
              <th>Bill No</th>
              <th>Bill Date</th>
              <th>Due Date</th>
              <th class="text-end">Balance</th>
            </tr>
          </thead>
          <tbody>
    `;

    party.bills.forEach(b => {
      html += `
        <tr>
          <td class="fw-bold text-dark">${b.invNo}</td>
          <td>${b.invDate}</td>
          <td>${b.dueDate}</td>
          <td class="text-end fw-bold text-danger">₹${Math.round(b.balAmt).toLocaleString('en-IN')}</td>
        </tr>
      `;
    });

    html += `</tbody></table></div>`;
    document.getElementById('billModalBody').innerHTML = html;
    billModal.show();
  }

  function recordFollowUpNote(code) {
    const note = prompt('Enter follow-up update/promise date:');
    if (note) {
      alert('Note saved for party ' + code);
    }
  }
</script>
</body>
</html>
